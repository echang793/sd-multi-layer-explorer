    const cacheSet = (k, d) => { try { localStorage.setItem(k, JSON.stringify({ t: Date.now(), d })); } catch { /* quota or blocked */ } };

    async function getJSON(url) {
      const r = await fetch(url, { headers: { Accept: 'application/geo+json' } });
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    }

    async function fetchHood(n, dayStart) {
      const base = nwsBase();
      const ptKey = `sdx.nws.pt.${base}.${n.id}`;
      let gridUrl = cacheGet(ptKey, PT_TTL);
      if (!gridUrl) {
        const pj = await getJSON(`${base}/points/${n.lat.toFixed(4)},${n.lon.toFixed(4)}`);
        gridUrl = pj && pj.properties && pj.properties.forecastGridData;
        if (!gridUrl) throw new Error('no forecast grid for this point');
        cacheSet(ptKey, gridUrl);
      }
      const gKey = `sdx.nws.grid.${gridUrl}`;
      let g = cacheGet(gKey, GRID_TTL);
      if (!g) {
        const p = SDX.nws.validateGridpoint(await getJSON(gridUrl)).properties;
        g = {
          uom: p.temperature.uom || 'wmoUnit:degC', updated: p.updateTime || null,
          t: p.temperature.values, rh: p.relativeHumidity.values, sky: p.skyCover.values,
        };
        cacheSet(gKey, g);
      }
      const N = SDX.nws;
      const isF = /degF$/.test(g.uom);
      const t = N.dayHours(N.expandSeries(g.t), dayStart).map((v) => (v == null ? null : isF ? v : N.cToF(v)));
      if (t.every((v) => v == null)) throw new Error('forecast has no temperatures for today');
      return { t, rh: N.dayHours(N.expandSeries(g.rh), dayStart), sky: N.dayHours(N.expandSeries(g.sky), dayStart), updated: g.updated };
    }

    const fmtUpdated = (iso) => (iso ? new Date(iso).toLocaleTimeString([], { ...TZ_OPTS, hour: 'numeric', minute: '2-digit' }) : '');

    // Test hook (console only): pretend the live data is an hour old to exercise the refresh.
    window.SDXDebugLive = {
      expire: () => { if (live) live.fetchedAt = 0; },
      info: () => (live ? { ok: live.ok, loading: live.loading, refreshing: !!live.refreshing, dayKey: live.dayKey, fetchedAt: live.fetchedAt, retryAt: live.retryAt || 0 } : null),
      staleDay: () => { if (live) live.dayKey = '1999-01-01'; },
    };

    // Hourly (and at San Diego midnight) pull a fresh forecast in the background.
    function maybeRefreshLive(ctx) {
      if (ctx.state.source !== 'live' || !live || live.loading || live.refreshing) return;
      if (Date.now() < (live.retryAt || 0)) return; // backing off after a failed refresh
      const stale = Date.now() - live.fetchedAt >= GRID_TTL || live.dayKey !== SDX.time.dayKey();
      if (stale) loadLive(ctx, { background: true });
    }

    // background: keep showing the current data while a fresh copy loads (hourly refresh).
    async function loadLive(ctx, { background = false } = {}) {
      const token = ++liveToken;
      const next = { byHood: new Map(), loading: true, done: 0, total: HOODS.length, ok: 0, missing: [], updated: null, dayKey: SDX.time.dayKey(), fetchedAt: 0 };
      if (background && live) live.refreshing = true;
      else {
        live = next;
        ctx.map.getContainer().classList.add('mc-loading');
        if (display != null) render(ctx, display, true);
      }
      syncModeUI(ctx);
      const dayStart = SDX.time.dayStartMs();
      const queue = [...HOODS];
      const errors = [];
      const worker = async () => {
        while (queue.length) {
          const n = queue.shift();
          try {
            const d = await fetchHood(n, dayStart);
            if (token !== liveToken) return;
            next.byHood.set(n.id, d);
            next.ok++;
            if (d.updated && (!next.updated || d.updated > next.updated)) next.updated = d.updated;
          } catch (err) {
            if (token !== liveToken) return;
            errors.push(`${n.name}: ${err.message}`);
            next.missing.push(n.name);
          } finally {
            if (token === liveToken) { next.done++; syncModeUI(ctx); }
          }
        }
      };
      await Promise.all(Array.from({ length: NWS_CONCURRENCY }, worker));
      if (token !== liveToken) return;
      ctx.map.getContainer().classList.remove('mc-loading');
      next.loading = false;
      if (!next.ok) {
        console.error('[SDX] live weather failed for every area', errors);
        if (background && live && live !== next) {
          // Keep the older live data on screen, but say it's stale.
          live.refreshing = false;
          live.retryAt = Date.now() + REFRESH_RETRY_MS; // back off instead of retrying (and toasting) every minute
          ctx.toast(`Couldn't refresh live weather; still showing the ${fmtUpdated(live.updated) || 'earlier'} forecast`);
          syncModeUI(ctx);
          return;
        }
        live = null;
        ctx.toast('Live weather is unavailable right now, so showing the simulated day');
        ctx.setState({ source: 'sim' });
        return;
      }
      next.fetchedAt = Date.now();
      live = next;
      if (errors.length) {
        console.warn('[SDX] live weather missing for some areas', errors);
        ctx.toast(`No live data for ${errors.length} area${errors.length > 1 ? 's' : ''}; shown as —`);
      }
      refreshMode(ctx);
    }

    // ------------------------------------------------------------ drawing
    function fogRings(f, inner) {
      const off = [];
      const inl = [];
      for (const [lat, lon, depth] of SDX.DATA.coastline) {
        off.push([lat, lon - (0.05 + 0.13 * f) - (inner ? 0.015 : 0)]);
        inl.push([lat, lon + depth * f * (inner ? 0.8 : 1)]);
      }
      return off.concat(inl.reverse());
    }

    function ambientWeights(hr) {
      const bump = (x, a, b, c) => (x <= a || x >= c ? 0 : x < b ? smoothstep((x - a) / (b - a)) : 1 - smoothstep((x - b) / (c - b)));
      return {
        dawn: bump(hr, 4.5, 6.6, 9.5) * 0.65,
        day: bump(hr, 8.5, 13, 17.5) * 0.8,
        dusk: bump(hr, 16.5, 19.3, 21.8),
        night: smoothstep((hr - 20) / 2) * 0.85,
      };
    }

    function phaseOf(hr) {
      if (hr < 8) return 'sunrise';
      if (hr < 17) return 'sun';
      if (hr < 20) return 'sunset';
      return 'moon';
    }

    function fogStatus(ctx, hr, f) {
      if (pending(ctx)) return 'Loading live weather…';
      if (isLive(ctx)) return `Coastal cloud cover ${Math.round(f * 100)}% · NWS`;
      const word = f >= 0.98 ? 'Marine layer in' : hr < 15 && f > 0.01 ? 'Burning off' : f <= 0.01 ? 'Clear skies' : 'Rolling back in';
      return `${word} · ${Math.round(f * 100)}% coverage`;
    }

    function sparkSVG(values, hour, color) {
      const W = 220;
      const H = 46;
      const nums = values.filter((v) => v != null);
      if (!nums.length) return '';
      const lo = Math.min(...nums) - 3;
      const hi = Math.max(...nums) + 3;
      const y = (v) => H - 5 - ((v - lo) / (hi - lo)) * (H - 10);
      let d = '';
      let pen = false;
      values.forEach((v, i) => {
        if (v == null) { pen = false; return; }
        d += `${pen ? 'L' : 'M'}${((i / 23) * W).toFixed(1)} ${y(v).toFixed(1)}`;
        pen = true;
      });
      const cur = lerpSeries(values, hour);
      const dot = cur == null ? '' : `<circle cx="${((hour / 23) * W).toFixed(1)}" cy="${y(cur).toFixed(1)}" r="4" fill="${color}" stroke="#0b1020" stroke-width="2"/>`;
      return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true">
        <rect class="night" x="0" y="0" width="${(6 / 23) * W}" height="${H}"/>
        <rect class="night" x="${(22 / 23) * W}" y="0" width="${W - (22 / 23) * W}" height="${H}"/>
        <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round"/>${dot}</svg>`;
    }

    function popupHTML(ctx, n, hour) {
      const v = hoodAt(ctx, n, hour);
      const lv = isLive(ctx);
      const head = `<div class="pp-head"><span class="badge" style="--bc:${ZONE_COLOR[n.zone]}">${esc(SDX.ZONES[n.zone].label)}</span><span class="muted mono">${fmtHour(hour)}</span></div>
        <div class="pp-name">${esc(n.name)}</div>`;
      if (!v) return `${head}<div class="pp-temp mono" style="color:#8a94a6">—</div><div class="pp-note">No live NWS data for this area right now.</div>`;
      const f = fogAt(ctx, hour);
      const sky = lv
        ? (() => { const d = live.byHood.get(n.id); const s = d && lerpSeries(d.sky, hour); return s == null ? '' : `sky ${Math.round(s)}% cloud`; })()
        : n.zone === 'coastal' || n.zone === 'central'
          ? (f > 0.6 ? 'thick marine layer' : f > 0.05 ? 'patchy marine layer' : 'sunny')
          : 'no marine layer';
      const series = lv ? live.byHood.get(n.id).t : C.zoneCurve24(n.zone).map((t) => t + n.offset);
      const note = lv
        ? `NWS forecast grid${live.updated ? ` · updated ${fmtUpdated(live.updated)}` : ''}`
        : 'Simulated late-summer day, not live weather.';
      return `${head}
        <div class="pp-temp mono" style="color:${heatColor(v.t)}">${Math.round(v.t)}°F</div>
        <div class="pp-stats"><span>RH <b class="mono">${v.rh == null ? '—' : Math.round(v.rh) + '%'}</b></span><span>${sky}</span></div>
        ${sparkSVG(series, hour, ZONE_COLOR[n.zone])}
        <div class="pp-note">${note}</div>`;
    }

    function placeCursor(ctx, hour) {
      const ui = ctx.ui;
      const ch = ui.chart;
      if (!ch || !ui.area) return;
      const metric = ctx.state.metric;
      const x = ch.scales.x.getPixelForValue(hour);
      ui.cline.style.transform = `translate3d(${x.toFixed(1)}px, ${ui.area.top}px, 0)`;
      SERIES.forEach((s, i) => {
        const v = pick(zoneAt(ctx, s.zone, hour), metric);
        const dot = ui.cdots[i];
        if (v == null) { dot.style.opacity = '0'; } else {
          dot.style.opacity = '';
          dot.style.transform = `translate3d(${x.toFixed(1)}px, ${ch.scales.y.getPixelForValue(v).toFixed(1)}px, 0)`;
        }
        const txt = fmtVal(v, metric);
        if (ui.vals[i]._r !== txt) { ui.vals[i]._r = txt; ui.vals[i].textContent = txt; }
      });
    }

    // Draw everything that depends on the eased hour. Cheap: only touches DOM when values change.
    function render(ctx, hour, force = false) {
      const metric = ctx.state.metric;
      for (const p of pins) {
        const v = pick(hoodAt(ctx, p.n, hour), metric);
        const txt = pending(ctx) ? '…' : fmtVal(v, metric);
        if (force || txt !== p.lastT) { p.lastT = txt; p.tEl.textContent = txt; }
        const ck = v == null ? 'na' : metric + Math.round(v * 3);
        if (force || ck !== p.lastC) {
          p.lastC = ck;
          p.root.style.setProperty('--c', colorFor(v, metric));
          p.root.classList.toggle('no-data', v == null && !pending(ctx));
        }
      }
      if (openPin && (force || openPin._lastPopupMin !== Math.round(hour * 12))) {
        openPin._lastPopupMin = Math.round(hour * 12);
        openPin.m.getPopup().setContent(popupHTML(ctx, openPin.n, hour));
      }

      const f = fogAt(ctx, hour);
      if (fogBase && (force || Math.abs(f - lastFog) > 0.002)) {
        lastFog = f;
        fogBase.setLatLngs(fogRings(f, false));
        fogTex.setLatLngs(fogRings(f * 0.85, true));
      }
      // Marine layer shows only while Microclimates is the focused layer (and toggled on).
      const on = ctx.state.fog && ctx.isFocused();
      for (const layer of [fogBase, fogTex]) {
        const svg = layer && layer._renderer && layer._renderer._container;
        if (svg) svg.style.opacity = on ? String(clamp(f * 3, 0, 1)) : '0';
      }

      if (ambient) {
        const w = ambientWeights(hour);
        for (const k of Object.keys(w)) {
          const val = w[k].toFixed(3);
          if (ambient[k].style.opacity !== val) ambient[k].style.opacity = val;
        }
      }

      // Throttled clock broadcast for any other module that wants to follow time-of-day.
      if (Math.abs(hour - lastClock) >= 0.05 || force) { lastClock = hour; ctx.bus.emit('clock', { hour, source: ctx.id }); }

      const ui = ctx.ui;
      if (ui.time) {
        const label = fmtHour(hour);
        if (ui.time.textContent !== label) { ui.time.textContent = label; ui.bubble.textContent = label; }
        const status = fogStatus(ctx, hour, f);
        if (ui.status.textContent !== status) ui.status.textContent = status;
        const ph = phaseOf(hour);
        if (ph !== lastPhase || force) {
          lastPhase = ph;
          ui.phases.forEach((el) => el.classList.toggle('on', el.dataset.phase === ph));
        }
      }
      if (ui.chart) placeCursor(ctx, hour);
      if (ui.tiles) {
        for (const tile of ui.tiles) {
          const v = zoneAt(ctx, tile.zone, hour);
          const main = pick(v, metric);
          const txt = main == null ? '—' : metric === 'rh' ? `${Math.round(main)}%` : `${Math.round(main)}°F`;
          if (force || tile.r !== txt) { tile.r = txt; tile.v.textContent = txt; tile.el.style.setProperty('--c', colorFor(main, metric)); }
          const other = v ? (metric === 'rh' ? v.t : v.rh) : null;
          const sub = other == null ? '—' : metric === 'rh' ? `${Math.round(other)}°F` : `RH ${Math.round(other)}%`;
          if (force || tile.rh !== sub) { tile.rh = sub; tile.hEl.textContent = sub; }
        }
        ui.meter.style.transform = `scaleX(${f.toFixed(3)})`;
        const pct = Math.round(f * 100) + '%';
        if (ui.meterV.textContent !== pct) ui.meterV.textContent = pct;
      }
    }

    // Everything that depends on source (sim/live) or metric (temp/humidity) but not the hour.
    function syncModeUI(ctx) {
      const s = ctx.state;
      const ui = ctx.ui;
      const lv = s.source === 'live';
      if (ui.segSrc) setSeg(ui.segSrc, s.source);
      if (ui.segMetric) setSeg(ui.segMetric, s.metric);
      if (ui.liveStatus) {
        let txt = '';
        if (lv && live && live.loading) txt = `Loading live weather ${live.done}/${live.total}…`;
        else if (lv && live) {
          const at = fmtUpdated(live.updated);
          txt = `Live · ${live.ok}/${live.total} areas${at ? ` · updated ${at}` : ''}${live.refreshing ? ' · refreshing…' : ''}${live.missing.length ? ` · no data: ${live.missing.slice(0, 3).join(', ')}${live.missing.length > 3 ? '…' : ''}` : ''}`;
        }
        ui.liveStatus.textContent = txt;
        ui.liveStatus.hidden = !txt;
      }
      if (ui.fogLbl) {
        ui.fogLbl.textContent = lv ? 'Coastal cloud layer' : 'Marine layer';
        ui.fogSub.textContent = lv ? 'Sized by NWS sky cover along the coast' : 'Burns off after 11 AM, returns after 7 PM';
      }
      if (ui.tintSwitch) ui.tintSwitch.setAttribute('aria-checked', String(s.tint));
      if (ui.fogSwitch) ui.fogSwitch.setAttribute('aria-checked', String(s.fog));
      if (ui.chart) {
        const rh = s.metric === 'rh';
        ui.chartTitle.textContent = rh ? '24-hour humidity' : '24-hour temperature';
        ui.chartSub.textContent = `by zone · ${rh ? '%' : '°F'}${isLive(ctx) ? ' · NWS' : ''}`;
        const y = ui.chart.options.scales.y;
        y.min = rh ? 0 : 40;
        y.max = 100;
        y.ticks.stepSize = rh ? 20 : 10;
        ui.chart.data.datasets.forEach((d, i) => { d.data = zoneCurve(ctx, SERIES[i].zone, s.metric).map((v, x) => ({ x, y: v })); });
        ui.chart.update();
        ui.meterTitle.textContent = isLive(ctx) ? 'Coastal cloud cover (NWS)' : 'Marine layer coverage';
        ui.meterNote.textContent = isLive(ctx)
          ? 'Average NWS forecast sky cover over the coastal areas. The layer on the map is sized by it.'
          : 'Coastal cloud deck pushes up Mission Valley and across the bay overnight, burns back to the beaches by early afternoon, then rolls in again after sunset.';
        ui.note.textContent = isLive(ctx)
          ? 'Live: National Weather Service forecast grid for today (api.weather.gov), cached for an hour. Areas without data show —; nothing is filled in.'
          : 'Simulated model of a typical late-summer day. Temperatures and fog are illustrative, not live weather.';
      }
    }

    function refreshMode(ctx) {
      syncModeUI(ctx);
      if (display != null) render(ctx, display, true);
      ctx.refreshLegend();
    }

    // Temperature pills, popups and the tint belong to Microclimates; hide them when another layer is focused.
    function applyFocusVisibility(ctx) {
      const off = !ctx.isFocused();
      ctx.map.getContainer().classList.toggle('sdx-temps-off', off);
      for (const p of pins) { const el = p.m.getElement(); if (el) el.tabIndex = off ? -1 : 0; }
      if (off && openPin) openPin.m.closePopup();
      if (ambient) ambient.el.classList.toggle('is-off', off || !ctx.state.tint);
    }

    function syncSlider(ctx) {
      const ui = ctx.ui;
      if (!ui.slider) return;
      const hr = ctx.state.hour;
      if (document.activeElement !== ui.slider || ctx.state.playing) ui.slider.value = String(hr);
      ui.wrap.style.setProperty('--p', ((hr - 6) / 16).toFixed(4));
    }

    // "Live now" pill + Now button state while the clock follows real San Diego time.
    function syncFollow(ctx) {
      const ui = ctx.ui;
      if (!ui.nowPill) return;
      const s = ctx.state;
      const real = SDX.time.hour();
      ui.nowPill.hidden = !s.follow;
      ui.nowPill.querySelector('b').textContent = real < 6 ? 'Live · before 6 AM' : real > 22 ? 'Live · after 10 PM' : 'Live now';
      ui.nowBtn.classList.toggle('is-on', s.follow);
      ui.nowBtn.setAttribute('aria-pressed', String(s.follow));
    }

    function syncPlay(ctx) {
      const b = ctx.ui.play;
      if (!b) return;
      const p = ctx.state.playing;
      b.classList.toggle('is-playing', p);
      b.setAttribute('aria-label', p ? 'Pause day animation' : 'Play day animation');
      b.querySelector('.i-play').setAttribute('aria-hidden', String(p));
      b.querySelector('.i-pause').setAttribute('aria-hidden', String(!p));
    }

    function setHour(ctx, hr) {
      ctx.state.hour = clamp(hr, 6, 22); // hour is mutated in place; onFrame eases toward it
      syncSlider(ctx);
    }

    return {
      id: 'microclimates',
      name: 'Microclimates',
      description: 'Marine layer & neighborhood temperatures, 6 AM – 10 PM',
      icon: 'thermometer-sun',
      accent: '#38bdf8',

      // Opens at the current San Diego time and follows the real clock until you scrub.
      createState: () => ({ hour: clamp(SDX.time.hour(), 6, 22), follow: true, playing: false, fog: true, tint: true, source: 'sim', metric: 'temp' }),
      bounds: () => L.latLngBounds(HOODS.map((n) => [n.lat, n.lon])),

      onActivate(ctx) {
        const map = ctx.map;
        display = ctx.state.hour;
        lastFog = -1;
        lastPhase = '';

        for (const [name, z] of [['fog', 390], ['fogtex', 391], ['ambient', 250]]) {
          if (!map.getPane(name)) { const p = map.createPane(name); p.style.zIndex = String(z); }
        }
        const base = L.svg({ pane: 'fog', padding: 0.6 });
        const tex = L.svg({ pane: 'fogtex', padding: 0.6 });
        fogBase = L.polygon(fogRings(1, false), { renderer: base, stroke: false, fillColor: '#4aa8e8', fillOpacity: 0.36, fillRule: 'nonzero', interactive: false }).addTo(ctx.layer);
        fogTex = L.polygon(fogRings(0.85, true), { renderer: tex, stroke: false, fillColor: '#a6d8fb', fillOpacity: 0.2, fillRule: 'nonzero', interactive: false }).addTo(ctx.layer);

        ambient = { el: h('div', { class: 'sdx-ambient' }) };
        for (const k of ['dawn', 'day', 'dusk', 'night']) { ambient[k] = h('i', { class: 'amb ' + k }); ambient.el.append(ambient[k]); }
        map.getPane('ambient').append(ambient.el);
        onMapMove = () => {
          const sz = map.getSize();
          L.DomUtil.setPosition(ambient.el, map.containerPointToLayerPoint([-sz.x / 2, -sz.y / 2]));
          ambient.el.style.width = sz.x * 2 + 'px';
          ambient.el.style.height = sz.y * 2 + 'px';
        };
        map.on('move zoomend viewreset resize', onMapMove);
        onMapMove();
        onZoomTier = () => map.getContainer().classList.toggle('mc-far', map.getZoom() < 11);
        map.on('zoomend', onZoomTier);
        onZoomTier();

        const center = map.getCenter();
        const ranked = HOODS.map((n) => ({ n, d: map.distance(center, [n.lat, n.lon]) })).sort((a, b) => a.d - b.d);
        pins = ranked.map(({ n }, rank) => {
          const m = L.marker([n.lat, n.lon], {
            keyboard: true, riseOnHover: true,
            icon: L.divIcon({
              className: 'sdx-icon', iconSize: [0, 0], iconAnchor: [0, 0],
              html: `<div class="sdx-anchor"><div class="sdx-temp${n.tier === 2 ? ' tier-2' : ''}" style="--i:${rank}"><span class="dot"></span><span class="t">--°</span><span class="nm">${esc(n.name)}</span></div></div>`,
            }),
          }).addTo(ctx.layer);
          m.bindPopup('', { offset: [0, -12], maxWidth: 260, minWidth: 220, autoPanPaddingTopLeft: [20, 90] });
          const el = m.getElement();
          el.setAttribute('aria-label', `${n.name} weather`);
          el.setAttribute('role', 'button');
          return { n, m, root: el.querySelector('.sdx-temp'), tEl: el.querySelector('.t'), lastT: null, lastC: null };
        });
        onPopupOpen = (e) => {
          const p = pins.find((x) => x.m === e.popup._source);
          if (!p) return;
          openPin = p;
          p._lastPopupMin = null;
          p.m.getPopup().setContent(popupHTML(ctx, p.n, display));
        };
        onPopupClose = (e) => { if (openPin && openPin.m === e.popup._source) openPin = null; };
        map.on('popupopen', onPopupOpen);
        map.on('popupclose', onPopupClose);

        if (ctx.state.source === 'live' && !live) loadLive(ctx);
        refreshTimer = setInterval(() => maybeRefreshLive(ctx), 60e3);
        onVisible = () => { if (document.visibilityState === 'visible') { lastNowCheck = 0; maybeRefreshLive(ctx); } };
        document.addEventListener('visibilitychange', onVisible);
        render(ctx, display, true);
        applyFocusVisibility(ctx);
      },

      onDeactivate(ctx) {
        const map = ctx.map;
        ctx.state.playing = false;
        liveToken++; // cancel any in-flight live load
        if (live && live.loading) live = null;
        if (live) live.refreshing = false;
        clearInterval(refreshTimer);
        document.removeEventListener('visibilitychange', onVisible);
        map.getContainer().classList.remove('sdx-temps-off', 'mc-far', 'mc-loading');
        map.off('move zoomend viewreset resize', onMapMove);
        map.off('zoomend', onZoomTier);
        map.off('popupopen', onPopupOpen);
        map.off('popupclose', onPopupClose);
        const amb = ambient;
        if (amb) { amb.el.classList.add('is-off'); setTimeout(() => amb.el.remove(), 650); }
        ambient = null;
        for (const layer of [fogBase, fogTex]) {
          const svg = layer && layer._renderer && layer._renderer._container;
          if (svg) svg.style.opacity = '0';
        }
        fogBase = fogTex = null;
        pins = [];
        openPin = null;
      },

      onStateChange(ctx, prev) {
        const s = ctx.state;
        if (s.playing !== prev.playing) syncPlay(ctx);
        if (s.tint !== prev.tint) { applyFocusVisibility(ctx); syncModeUI(ctx); }
        if (s.follow !== prev.follow) { syncFollow(ctx); if (s.follow) lastNowCheck = 0; }
        if (s.source !== prev.source) {
          if (s.source === 'live') {
            const fresh = live && !live.loading && Date.now() - live.fetchedAt < GRID_TTL && live.dayKey === SDX.time.dayKey();
            if (fresh) refreshMode(ctx); else loadLive(ctx);
          } else {
            liveToken++;
            if (live && live.loading) live = null;
            ctx.map.getContainer().classList.remove('mc-loading');
            refreshMode(ctx);
          }
          return;
        }
        if (s.fog !== prev.fog || s.metric !== prev.metric) refreshMode(ctx);
      },

      // Fade the marine layer, pills and tint out when another layer takes focus, back in on return.
      onFocus(ctx) { if (display != null) render(ctx, display, true); applyFocusVisibility(ctx); },
      onBlur(ctx) { if (display != null) render(ctx, display, true); applyFocusVisibility(ctx); },

      onFrame(ctx, dt, t) {
        const s = ctx.state;
        // Following the real clock: re-read San Diego time about once a second.
        if (s.follow && !s.playing && t - lastNowCheck > 1000) {
          lastNowCheck = t;
          const target = clamp(SDX.time.hour(), 6, 22);
          if (Math.abs(target - s.hour) > 1 / 240) setHour(ctx, target);
          syncFollow(ctx);
        }
        if (s.playing) {
          let next = s.hour + dt * PLAY_HOURS_PER_MS;
          if (next >= 22) { next = 22; s.playing = false; syncPlay(ctx); }
          setHour(ctx, next);
        }
        if (display == null) display = s.hour;
        const diff = s.hour - display;
        if (Math.abs(diff) > 1e-4) {
          const k = motion() ? 1 - Math.exp(-dt / (s.playing ? 40 : 110)) : 1;
          display = Math.abs(diff) < 1e-3 ? s.hour : display + diff * k;
          render(ctx, display);
        }
      },

      renderControls(el, ctx) {
        el.innerHTML = `
          <div class="dock-row">
            <div class="time-block">
              <div class="phase" aria-hidden="true">
                <span class="p-sunrise" data-phase="sunrise">${icon('sunrise')}</span>
                <span class="p-sun" data-phase="sun">${icon('sun')}</span>
                <span class="p-sunset" data-phase="sunset">${icon('sunset')}</span>
                <span class="p-moon" data-phase="moon">${icon('moon')}</span>
              </div>
              <div>
                <div class="flex items-center gap-2"><div class="time-big mono" aria-live="off">--</div>${deviceIsPacific ? '' : '<span class="tz-tag mono">PT</span>'}</div>
                <div class="time-sub">--</div>
                <div class="now-pill" hidden><i></i><b>Live now</b></div>
              </div>
            </div>
            <button type="button" class="play">
              <span class="i-play">${icon('play')}</span><span class="i-pause" aria-hidden="true">${icon('pause')}</span>
            </button>
          </div>
          <div class="range-wrap">
            <div class="range-bubble mono">--</div>
            <input class="sdx-range" type="range" min="6" max="22" step="any" aria-label="Time of day">
            <div class="range-ticks mono"><span>6a</span><span>10a</span><span>2p</span><span>6p</span><span>10p</span></div>
          </div>
          <div class="seg-row">
            <span class="eyebrow">Data</span>
            ${segHTML('src', [['sim', 'Simulated day'], ['live', 'Live today · NWS']], 'Weather data source')}
          </div>
          <div class="sub live-status mono" hidden></div>
          <div class="seg-row">
            <span class="eyebrow">Show</span>
            ${segHTML('metric', [['temp', 'Temperature'], ['rh', 'Humidity']], 'Marker metric')}
          </div>
          <div class="dock-row" style="margin-top:12px">
            <div class="flex items-center gap-3">
              <button type="button" class="switch sw-fog" role="switch" style="--accent:#38bdf8" aria-label="Marine layer overlay"></button>
              <div><div class="lbl fog-lbl">Marine layer</div><div class="sub fog-sub">Burns off after 11 AM, returns after 7 PM</div></div>
            </div>
            <button type="button" class="btn now" aria-pressed="false" title="Jump to the current San Diego time and keep following it">${icon('locate-fixed')}Now</button>
          </div>
          <div class="dock-row" style="margin-top:10px">
            <div class="flex items-center gap-3">
              <button type="button" class="switch sw-tint" role="switch" style="--accent:#a78bfa" aria-label="Time-of-day tint"></button>
              <div><div class="lbl">Time-of-day tint</div><div class="sub">Dawn and dusk color wash over the map</div></div>
            </div>
          </div>`;
        const ui = ctx.ui;
        ui.time = el.querySelector('.time-big');
        ui.status = el.querySelector('.time-sub');
        ui.phases = [...el.querySelectorAll('.phase > span')];
        ui.play = el.querySelector('.play');
        ui.slider = el.querySelector('.sdx-range');
        ui.wrap = el.querySelector('.range-wrap');
        ui.bubble = el.querySelector('.range-bubble');
        ui.fogSwitch = el.querySelector('.sw-fog');
        ui.tintSwitch = el.querySelector('.sw-tint');
        ui.fogLbl = el.querySelector('.fog-lbl');
        ui.fogSub = el.querySelector('.fog-sub');
        ui.liveStatus = el.querySelector('.live-status');
        ui.segSrc = el.querySelector('.seg[data-seg="src"]');
        ui.segMetric = el.querySelector('.seg[data-seg="metric"]');
        ui.nowPill = el.querySelector('.now-pill');
        ui.nowBtn = el.querySelector('.now');
        // Any manual time change stops following the real clock; Now resumes it.
        const stopFollow = () => { if (ctx.state.follow) ctx.setState({ follow: false }); };

        ui.play.addEventListener('click', () => {
          stopFollow();
          if (!ctx.state.playing && ctx.state.hour >= 21.99) setHour(ctx, 6);
          ctx.setState({ playing: !ctx.state.playing });
        });
        ui.slider.addEventListener('pointerdown', () => { stopFollow(); if (ctx.state.playing) ctx.setState({ playing: false }); });
        ui.slider.addEventListener('input', () => { stopFollow(); setHour(ctx, Math.round(Number(ui.slider.value) * 4) / 4); });
        ui.slider.addEventListener('keydown', (e) => {
          const steps = { ArrowLeft: -0.25, ArrowDown: -0.25, ArrowRight: 0.25, ArrowUp: 0.25, PageDown: -1, PageUp: 1 };
          if (e.key in steps) setHour(ctx, Math.round((ctx.state.hour + steps[e.key]) * 4) / 4);
          else if (e.key === 'Home') setHour(ctx, 6);
          else if (e.key === 'End') setHour(ctx, 22);
          else return;
          e.preventDefault();
          stopFollow();
          if (ctx.state.playing) ctx.setState({ playing: false });
        });
        ui.fogSwitch.addEventListener('click', () => ctx.setState({ fog: !ctx.state.fog }));
        ui.tintSwitch.addEventListener('click', () => ctx.setState({ tint: !ctx.state.tint }));
        bindSeg(ui.segSrc, (v) => ctx.setState({ source: v }));
        bindSeg(ui.segMetric, (v) => ctx.setState({ metric: v }));
        ui.nowBtn.addEventListener('click', () => {
          if (ctx.state.playing) ctx.setState({ playing: false });
          setHour(ctx, SDX.time.hour());
          ctx.setState({ follow: true });
        });

        syncSlider(ctx);
        syncPlay(ctx);
        syncFollow(ctx);
        syncModeUI(ctx);
        render(ctx, display ?? ctx.state.hour, true);
      },

      renderSidebar(el, ctx) {
        el.innerHTML = `
          <section class="card">
            <div class="card-h"><h3 class="chart-title">24-hour temperature</h3><span class="muted chart-sub">by zone · °F</span></div>
            <div class="series-legend">${SERIES.map((s) => `<span class="it" style="--c:${s.color}"><i></i>${SDX.ZONES[s.zone].label} <b class="mono">--</b></span>`).join('')}</div>
            <div class="chart-wrap">
              <canvas role="img" aria-label="Line chart of temperature or humidity over 24 hours for coastal, inland and mountain zones"></canvas>
              <i class="cursor-line"></i>
              ${SERIES.map((s) => `<i class="cdot" style="--c:${s.color}"></i>`).join('')}
            </div>
          </section>
          <section class="card">
            <div class="card-h"><h3>Right now</h3><span class="muted">zone averages</span></div>
            <div class="tiles">
              ${ZONES4.map((z) => `<div class="tile" data-zone="${z}"><div class="tn"><i></i>${SDX.ZONES[z].label}</div><div class="tv mono">--</div><div class="th mono">--</div></div>`).join('')}
            </div>
          </section>
          <section class="card">
            <div class="card-h"><h3 class="meter-title">Marine layer coverage</h3><b class="mono meter-v">--</b></div>
            <div class="meter"><i></i></div>
            <p class="sub meter-note" style="margin-top:9px"></p>
          </section>
          <p class="note">${icon('info')}<span class="note-text"></span></p>`;

        const ui = ctx.ui;
        ui.vals = [...el.querySelectorAll('.series-legend b')];
        ui.cline = el.querySelector('.cursor-line');
        ui.cdots = [...el.querySelectorAll('.cdot')];
        ui.tiles = [...el.querySelectorAll('.tile')].map((t) => ({ el: t, zone: t.dataset.zone, v: t.querySelector('.tv'), hEl: t.querySelector('.th') }));
        ui.meter = el.querySelector('.meter > i');
        ui.meterV = el.querySelector('.meter-v');
        ui.meterTitle = el.querySelector('.meter-title');
        ui.meterNote = el.querySelector('.meter-note');
        ui.note = el.querySelector('.note-text');
        ui.chartTitle = el.querySelector('.chart-title');
        ui.chartSub = el.querySelector('.chart-sub');

        const nightShade = {
          id: 'nightShade',
          beforeDatasetsDraw(ch) {
            const { ctx: g, chartArea: a, scales: { x } } = ch;
            g.save();
            g.fillStyle = 'rgba(99,102,241,.08)';
            const x6 = x.getPixelForValue(6);
            const x22 = x.getPixelForValue(22);
            g.fillRect(a.left, a.top, x6 - a.left, a.bottom - a.top);
            g.fillRect(x22, a.top, a.right - x22, a.bottom - a.top);
            g.restore();
          },
        };
        const glow = {
          id: 'glow',
          beforeDatasetDraw(ch, args) { ch.ctx.save(); ch.ctx.shadowColor = ch.data.datasets[args.index].borderColor; ch.ctx.shadowBlur = 12; },
          afterDatasetDraw(ch) { ch.ctx.restore(); },
        };
        const cursorSync = {
          id: 'cursorSync',
          afterLayout(ch) {
            ui.area = ch.chartArea;
            if (ui.cline) ui.cline.style.height = ch.chartArea.bottom - ch.chartArea.top + 'px';
            placeCursor(ctx, display ?? ctx.state.hour);
          },
        };
        const rhMode = () => ctx.state.metric === 'rh';

        ui.chart = ctx.chart(el.querySelector('canvas'), {
          type: 'line',
          data: {
            datasets: SERIES.map((s) => ({
              label: SDX.ZONES[s.zone].label,
              data: zoneCurve(ctx, s.zone, ctx.state.metric).map((y, x) => ({ x, y })),
              borderColor: s.color, backgroundColor: s.color, borderWidth: 2, spanGaps: false,
              pointRadius: 0, pointHoverRadius: 5, pointHoverBorderWidth: 2, pointHoverBorderColor: '#0b1020',
              tension: 0.4, cubicInterpolationMode: 'monotone',
            })),
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            animation: motion() ? { duration: 900, easing: 'easeOutQuart' } : false,
            animations: motion() ? {
              y: {
                from: (c) => (c.chart.chartArea ? c.chart.chartArea.bottom : undefined),
                delay: (c) => (c.type === 'data' && c.mode === 'default' ? c.dataIndex * 18 + c.datasetIndex * 140 : 0),
              },
            } : {},
            layout: { padding: { top: 6, right: 6 } },
            scales: {
              x: {
                type: 'linear', min: 0, max: 23, grid: { display: false }, border: { color: 'rgba(148,163,184,.18)' },
                ticks: { stepSize: 3, callback: hourTick, maxRotation: 0, font: { family: 'JetBrains Mono', size: 10 } },
              },
              y: {
                min: 40, max: 100, border: { display: false }, grid: { color: 'rgba(148,163,184,.08)' },
                ticks: { stepSize: 10, callback: (v) => v + (rhMode() ? '%' : '°'), font: { family: 'JetBrains Mono', size: 10 } },
              },
            },
            plugins: {
              legend: { display: false },
              tooltip: {
                ...TOOLTIP,
                callbacks: {
                  title: (items) => fmtHour(items[0].parsed.x),
                  label: (i) => ` ${i.dataset.label}  ${Math.round(i.parsed.y)}${rhMode() ? '%' : '°F'}`,
                },
              },
            },
          },
          plugins: [nightShade, glow, cursorSync],
        });

        syncModeUI(ctx);
        render(ctx, display ?? ctx.state.hour, true);
      },

      legend(ctx) {
        if (!ctx.isFocused()) return '';
        const s = ctx.state;
        const lv = isLive(ctx);
        const ramp = s.metric === 'rh'
          ? `<div class="lg-title">Humidity${lv ? ' · NWS' : ''}</div><div class="lg-ramp rh"></div><div class="lg-ticks mono"><span>0%</span><span>50%</span><span>100%</span></div>`
          : `<div class="lg-title">Temperature${lv ? ' · NWS' : ''}</div><div class="lg-ramp"></div><div class="lg-ticks mono"><span>60°</span><span>76°</span><span>98°</span></div>`;
        const fog = s.fog ? `<div class="lg-row"><i class="sw fog"></i>${lv ? 'Coastal cloud (NWS)' : 'Marine layer'}</div>` : '';
        const missing = lv && live && live.missing.length ? '<div class="lg-row"><i class="sw nodata"></i>— no live data</div>' : '';
        return ramp + fog + missing;
      },
    };
  })();

  // ==================================================================
  // MODULE 2: Taco & Brewery Hotspots
  // ==================================================================
  const Hotspots = (() => {
    const LM = SDX.DATA.landmarks;
    const HOODS = new Map(SDX.DATA.neighborhoods.map((n) => [n.id, n]));
    const byId = new Map(LM.map((p) => [p.id, p]));
    const FILTERS = [
      { key: 'crawlable', label: 'Crawlable Only', hint: 'pairs ≤ 1.5 mi', icon: 'footprints' },
      { key: 'hazyIPA', label: 'Hazy IPA Focus', hint: 'simulated', icon: 'hop' },
      { key: 'open247', label: '24/7 Taco Shops', hint: 'per OSM hours', icon: 'clock' },
      { key: 'bajaFish', label: 'Mariscos / Baja', hint: 'seafood spots', icon: 'fish' },
      { key: 'openNow', label: 'Open Now', hint: 'posted hours', icon: 'store' },
      { key: 'near', label: 'Near Me', hint: 'uses your location', icon: 'navigation' },
    ];
    const NEAR_OPTS = [1, 3, 5, 10];
    const ME = '@me';
    const BREW = '#c98500';
    const TACO = '#e5484d';
    const HEAT_GRADIENT = { 0.2: '#5c2a06', 0.45: '#c98500', 0.7: '#f2b53a', 0.85: '#ff7a59', 1: '#e5484d' };

    // Markers live in a cluster group, which destroys and recreates their DOM as clusters
    // split and merge. So visual state is kept on the pin and re-applied on every 'add'.
    let pins = new Map();   // id -> { p, m, shown, pinned, dim, selected, target, d }
    let cluster = null;
    let pinnedGroup = null; // crawl pins pulled out of clusters so the route is always visible
    let crawlGroup = null;
    let meGroup = null;
    let heat = null;
    let onMapClick = null;
    let openTimer = null;
    let radiusRaf = 0;
    let targets = [];
    let introUntil = 0;
    let locating = false;

    const fmtR = (mi) => `${+mi.toFixed(2)} mi`;
    const nearFlag = (s) => (s.filters.near && s.me ? { lat: s.me.lat, lon: s.me.lon, mi: s.nearMi } : null);

    // Crawlable is O(n^2) over ~365 spots; memoize on the filters object plus everything else
    // the result depends on (radius, your location, and the minute when Open Now is on).
    let memo = { filters: null, key: '', out: [] };
    const visible = (ctx) => {
      const s = ctx.state;
      const minute = s.filters.openNow ? Math.floor(Date.now() / 60e3) : 0;
      const key = [s.radiusMi, s.nearMi, s.me ? `${s.me.lat},${s.me.lon}` : '', minute].join('|');
      if (memo.filters !== s.filters || memo.key !== key) {
        memo = {
          filters: s.filters, key,
          out: SDX.filters.applyFilters(LM, { ...s.filters, near: nearFlag(s), radiusMi: s.radiusMi, now: new Date() }),
        };
      }
      return memo.out;
    };

    const originOf = (ctx, id) => (id === ME
      ? (ctx.state.me ? { id: ME, name: 'Your location', lat: ctx.state.me.lat, lon: ctx.state.me.lon, type: 'me' } : null)
      : byId.get(id));

    function paintPin(pin) {
      const host = pin.m.getElement();
      if (!host) return;
      const el = host.querySelector('.sdx-pin');
      el.classList.toggle('is-dim', pin.dim);
      el.classList.toggle('is-selected', pin.selected);
      el.classList.toggle('is-target', pin.target);
      el.style.setProperty('--d', pin.d || '0ms');
      if (performance.now() > introUntil) el.style.setProperty('--i', '0');
      host.setAttribute('role', 'button');
      host.setAttribute('aria-label', `${pin.p.type === 'brewery' ? 'Brewery' : 'Taco shop'}: ${pin.p.name}`);
    }

    function pinOut(pin) { // move from cluster to the always-visible group
      if (pin.pinned || !pin.shown) return;
      pin.pinned = true;
      cluster.removeLayer(pin.m);
      pinnedGroup.addLayer(pin.m);
    }
    function pinBack(pin) {
      if (!pin.pinned) return;
      pin.pinned = false;
      pinnedGroup.removeLayer(pin.m);
      if (pin.shown) cluster.addLayer(pin.m);
    }

    function clusterIcon(c) {
      const kids = c.getAllChildMarkers();
      const n = kids.length;
      const b = kids.filter((m) => m.options.poiType === 'brewery').length;
      const size = n < 10 ? 38 : n < 40 ? 46 : 56;
      return L.divIcon({
        className: 'sdx-icon', iconSize: [0, 0], iconAnchor: [0, 0],
        html: `<div class="sdx-anchor"><div class="sdx-cluster" style="--pb:${Math.round((b / n) * 100)}%;--s:${size}px" title="${b} breweries · ${n - b} taco shops"><b class="mono">${n}</b></div></div>`,
      });
    }
    const tagChips = (p) => SDX.tags.activeLabels(p).map((t) => `<span class="tag on">${t}</span>`).join('');

    // "Open now · closes 11 PM" / "Closed · opens Tue 4 PM" / "Hours unknown"
    function hoursLine(p) {
      const now = new Date();
      const st = SDX.hours.nextChange(p.hours, now);
      if (!st) return { cls: 'unk', text: 'Hours unknown' };
      if (st.open && !st.at) return { cls: 'open', text: 'Open 24/7' };
      if (!st.at) return { cls: st.open ? 'open' : 'closed', text: st.open ? 'Open now' : 'Closed' };
      const other = SDX.time.dayKey(st.at) !== SDX.time.dayKey(now);
      const when = `${other ? st.at.toLocaleDateString([], { ...TZ_OPTS, weekday: 'short' }) + ' ' : ''}${fmtClockPT(st.at)}`;
      return st.open ? { cls: 'open', text: `Open now · closes ${when}` } : { cls: 'closed', text: `Closed · opens ${when}` };
    }

    function poiPopup(ctx, p) {
      const isBrew = p.type === 'brewery';
      const tags = tagChips(p);
      const hl = hoursLine(p);
      let foot = '';
      if (isBrew) {
        const near = SDX.crawl.nearestTacos(p, visible(ctx), { max: 1, radiusMi: 5 })[0];
        if (near) foot = `Nearest taco: <b>${esc(near.poi.name)}</b> · ${fmtMi(near.miles)} · ${near.minutes} min walk`;
      } else {
        const brews = visible(ctx).filter((b) => b.type === 'brewery')
          .map((b) => ({ b, mi: SDX.geo.haversineMi(p, b) })).sort((a, b) => a.mi - b.mi)[0];
        if (brews) foot = `Nearest brewery: <b>${esc(brews.b.name)}</b> · ${fmtMi(brews.mi)} · ${SDX.geo.walkMinutes(brews.mi)} min walk`;
      }
      const you = ctx.state.me ? ` · ${fmtMi(SDX.geo.haversineMi(ctx.state.me, p))} from you` : '';
      return `<div class="pp-head"><span class="badge" style="--bc:${isBrew ? '#f2b53a' : '#ff7a59'}">${isBrew ? '🍺 Brewery' : '🌮 Taco shop'}</span><span class="muted">${esc(SDX.placeLabel(p))}${you}</span></div>
        <div class="pp-name">${esc(p.name)}</div>
        ${p.addr ? `<div class="muted" style="margin-top:2px">${esc(p.addr)}</div>` : ''}
        <div class="hours-line ${hl.cls}"><i></i>${esc(hl.text)}</div>
        ${p.hours && p.hours !== '24/7' ? `<div class="muted mono" style="margin-top:2px;font-size:11px">${esc(p.hours)}</div>` : ''}
        ${tags ? `<div class="tagrow">${tags}</div>` : ''}
        ${foot ? `<div class="pp-foot">${foot}</div>` : ''}
        <div class="pp-note">Location &amp; hours: OpenStreetMap${isBrew ? ' · Hazy IPA tag is simulated' : ''}</div>`;
    }

    function openPopup(ctx, p) {
      L.popup({ offset: [0, -20], maxWidth: 280, minWidth: 220, autoPanPaddingTopLeft: [20, 90] })
        .setLatLng([p.lat, p.lon]).setContent(poiPopup(ctx, p)).openOn(ctx.map);
    }

    function applyVisibility(ctx) {
      const vis = new Set(visible(ctx).map((p) => p.id));
      const s = ctx.state;
      const now = new Date();
      const add = [];
      const remove = [];
      for (const [id, pin] of pins) {
        const show = vis.has(id);
        if (!pin.pinned && show !== pin.shown) (show ? add : remove).push(pin.m);
        pin.shown = show;
        // Dim spots outside the chosen area, and (with Open Now on) spots whose hours are unknown.
        pin.dim = show && ((s.hood !== 'all' && pin.p.hood !== s.hood) || (s.filters.openNow && SDX.hours.isOpenAt(pin.p.hours, now) === null));
        paintPin(pin);
      }
      if (remove.length) cluster.removeLayers(remove);
      if (add.length) cluster.addLayers(add);
      syncHeat(ctx);
      return vis;
    }

    function syncHeat(ctx) {
      if (!heat) return;
      heat.setLatLngs(visible(ctx).map((p) => [p.lat, p.lon, p.type === 'brewery' ? 1 : 0.8]));
    }

    function syncView(ctx) {
      const hm = ctx.state.view === 'heat';
      // Created on first use: the heat canvas is only needed once you switch to Heatmap.
      if (hm && !heat) {
        heat = L.heatLayer([], { radius: 24, blur: 20, maxZoom: 14, minOpacity: 0.25, gradient: HEAT_GRADIENT }).addTo(ctx.layer);
        syncHeat(ctx);
      }
      ctx.map.getContainer().classList.toggle('hs-heat', hm);
      if (hm) ctx.map.closePopup();
    }

    function syncMe(ctx) {
      if (!meGroup) return;
      meGroup.clearLayers();
      const s = ctx.state;
      if (!s.me || !s.filters.near) return;
      L.circle([s.me.lat, s.me.lon], {
        radius: s.nearMi * 1609.34, className: 'near-ring', color: '#38bdf8', weight: 1.5,
        dashArray: '4 6', fillColor: '#38bdf8', fillOpacity: 0.05, interactive: false,
      }).addTo(meGroup);
      L.marker([s.me.lat, s.me.lon], {
        interactive: false, keyboard: false, zIndexOffset: 100000,
        icon: L.divIcon({ className: 'sdx-icon', iconSize: [0, 0], iconAnchor: [0, 0], html: '<div class="sdx-anchor"><div class="sdx-me" title="You are here"></div></div>' }),
      }).addTo(meGroup);
    }

    function flyToMe(ctx) {
      const s = ctx.state;
      if (!s.me) return;
      ctx.flyTo(L.latLng(s.me.lat, s.me.lon).toBounds(s.nearMi * 2 * 1609.34), { maxZoom: 16, duration: 1 });
    }

    function requestLocation(ctx, onDone) {
      if (!('geolocation' in navigator)) { ctx.toast('This browser has no location access'); onDone(false); return; }
      locating = true;
      syncControls(ctx);
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          locating = false;
          const me = { lat: +pos.coords.latitude.toFixed(5), lon: +pos.coords.longitude.toFixed(5) };
          onDone(true);
          ctx.setState({ me, filters: { ...ctx.state.filters, near: true } });
        },
        (err) => {
          locating = false;
          const why = err.code === 1 ? 'location permission was denied' : err.code === 3 ? 'finding your location timed out' : 'your location is unavailable';
          ctx.toast(`Near Me is off: ${why}`);
          onDone(false);
          syncControls(ctx);
        },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 5 * 60e3 },
      );
    }

    function animateDraw(path, i) {
      if (!path) return;
      if (!motion()) { path.classList.add('ants'); return; }
      // pathLength=1 normalizes the dash so the draw-on works at any zoom level.
      path.setAttribute('pathLength', '1');
      path.style.strokeDasharray = '1';
      path.style.strokeDashoffset = '1';
      requestAnimationFrame(() => requestAnimationFrame(() => {
        path.style.transition = `stroke-dashoffset .85s var(--ease-in-out) ${280 + i * 140}ms`;
        path.style.strokeDashoffset = '0';
      }));
      path.addEventListener('transitionend', () => {
        path.removeAttribute('pathLength');
        path.style.transition = '';
        path.style.strokeDasharray = '';
        path.style.strokeDashoffset = '';
        path.classList.add('ants');
      }, { once: true });
    }

    function clearCrawl() {
      if (crawlGroup) crawlGroup.clearLayers();
      for (const pin of pins.values()) {
        if (!pin.selected && !pin.target && !pin.pinned) continue;
        pin.selected = pin.target = false;
        pin.d = '';
        pinBack(pin);
        paintPin(pin);
      }
      targets = [];
    }

    function drawCrawl(ctx, b, { fly = true } = {}) {
      clearCrawl();
      if (!b) return;
      const radius = ctx.state.radiusMi;
      const res = SDX.crawl.nearestTacos(b, visible(ctx), { max: 3, radiusMi: radius });
      targets = res;
      const bp = pins.get(b.id);
      if (bp) { bp.selected = true; pinOut(bp); paintPin(bp); }
      res.forEach((r, i) => {
        const line = L.polyline([[b.lat, b.lon], [r.poi.lat, r.poi.lon]], {
          className: 'crawl-line', color: '#f2b53a', weight: 3, opacity: 1, interactive: false,
        }).addTo(crawlGroup);
        // Label sits beside the taco pin (not the line midpoint) so tight clusters stay legible,
        // on the side facing away from the start so it never covers it.
        const east = r.poi.lon >= b.lon;
        L.tooltip({ permanent: true, direction: east ? 'right' : 'left', offset: [east ? 20 : -20, 0], className: 'crawl-tip', opacity: 1, interactive: false })
          .setLatLng([r.poi.lat, r.poi.lon])
          .setContent(`<span class="ct" style="--d:${i}"><i class="ci">${i + 1}</i><b>${fmtMi(r.miles)}</b> · ${r.minutes} min walk</span>`)
          .addTo(crawlGroup);
        animateDraw(line.getElement(), i);
        const tp = pins.get(r.poi.id);
        if (tp) { tp.target = true; tp.d = `${700 + i * 160}ms`; pinOut(tp); paintPin(tp); }
      });
      if (!res.length) ctx.toast(`No taco shops within ${fmtR(radius)} of ${b.id === ME ? 'you' : b.name} (with current filters)`);
      if (fly) {
        const pts = [[b.lat, b.lon], ...res.map((r) => [r.poi.lat, r.poi.lon])];
        // Side padding leaves room for the walk-time labels drawn beside each taco pin.
        ctx.flyTo(L.latLngBounds(pts), { maxZoom: res.length ? 17 : 15, duration: 0.9, padRight: 200, padLeft: 200 });
      }
    }

    function hoodCounts(ctx) {
      const vis = visible(ctx);
      const rows = new Map();
      for (const p of LM) if (!rows.has(p.hood)) rows.set(p.hood, { id: p.hood, name: HOODS.get(p.hood).name, b: 0, t: 0, all: 0 });
      for (const p of LM) rows.get(p.hood).all++;
      for (const p of vis) rows.get(p.hood)[p.type === 'brewery' ? 'b' : 't']++;
      return [...rows.values()].sort((a, b) => b.all - a.all || a.name.localeCompare(b.name));
    }

    // Controls whose text or state depend on radius / location / view.
    function syncControls(ctx) {
      const ui = ctx.ui;
      const s = ctx.state;
      if (ui.crawlSwitch) ui.crawlSwitch.setAttribute('aria-checked', String(s.crawl));
      if (ui.radV) ui.radV.textContent = fmtR(s.radiusMi);
      if (ui.radWrap) ui.radWrap.style.setProperty('--p', ((s.radiusMi - 0.5) / 2.5).toFixed(4));
      if (ui.radSlider && document.activeElement !== ui.radSlider) ui.radSlider.value = String(s.radiusMi);
      if (ui.crawlHint) ui.crawlHint.textContent = s.view === 'heat' ? 'Switch the view to Pins to crawl' : `Tap a 🍺 to map the 3 closest taco stops within ${fmtR(s.radiusMi)}`;
      if (ui.hintCrawlable) ui.hintCrawlable.textContent = `pairs ≤ ${fmtR(s.radiusMi)}`;
      if (ui.nearRow) ui.nearRow.hidden = !(s.filters.near && s.me);
      if (ui.segNear) setSeg(ui.segNear, String(s.nearMi));
      if (ui.segView) setSeg(ui.segView, s.view);
      if (ui.nearChip) {
        ui.nearChip.classList.toggle('is-loading', locating);
        const inp = ui.nearChip.querySelector('input');
        if (!locating) inp.checked = !!s.filters.near;
      }
    }

    function updateStats(ctx) {
      const ui = ctx.ui;
      const s = ctx.state;
      const vis = visible(ctx);
      if (ui.visCount) tweenNumber(ui.visCount, vis.length);
      if (!ui.donut) return;

      const scope = s.hood === 'all' ? vis : vis.filter((p) => p.hood === s.hood);
      const b = scope.filter((p) => p.type === 'brewery').length;
      const t = scope.length - b;
      const ds = ui.donut.data.datasets[0];
      ds.data = [b, t, b + t === 0 ? 1 : 0];
      ui.donut.update();
      tweenNumber(ui.total, b + t);
      tweenNumber(ui.bVal, b);
      tweenNumber(ui.tVal, t);
      const pct = (v) => (b + t ? Math.round((v / (b + t)) * 100) : 0) + '%';
      ui.bPct.textContent = pct(b);
      ui.tPct.textContent = pct(t);
      if (ui.sel.value !== s.hood) ui.sel.value = s.hood;

      const rows = hoodCounts(ctx);
      const max = Math.max(1, ...rows.map((r) => r.b + r.t));
      for (const r of rows) {
        const row = ui.rows.get(r.id);
        if (!row) continue;
        row.bEl.style.width = (r.b / max) * 100 + '%';
        row.tEl.style.width = (r.t / max) * 100 + '%';
        row.ct.textContent = `${r.b}·${r.t}`;
        row.el.classList.toggle('is-on', s.hood === r.id);
        row.el.setAttribute('aria-pressed', String(s.hood === r.id));
      }
      renderNearCard(ctx);
      renderCrawlCard(ctx);
    }

    function renderNearCard(ctx) {
      const card = ctx.ui.nearCard;
      if (!card) return;
      const s = ctx.state;
      const on = !!(s.me && s.filters.near);
      card.hidden = !on;
      if (!on) return;
      const list = visible(ctx)
        .map((p) => ({ p, mi: SDX.geo.haversineMi(s.me, p) }))
        .sort((a, b) => a.mi - b.mi).slice(0, 6);
      ctx.ui.nearList.innerHTML = list.length ? list.map(({ p, mi }, i) => `
        <button type="button" class="step" data-id="${p.id}" style="animation-delay:${i * 50}ms">
          <span class="n mono ${p.type}">${p.type === 'brewery' ? '🍺' : '🌮'}</span>
          <span class="min-w-0"><span class="t block truncate">${esc(p.name)}</span><span class="m">${esc(hoursLine(p).text)}</span></span>
          <span class="w mono">${fmtMi(mi)}${mi <= 2 ? ` · ${SDX.geo.walkMinutes(mi)}m` : ''}</span>
        </button>`).join('') : `<div class="muted">Nothing within ${s.nearMi} mi with the current filters.</div>`;
      ctx.ui.nearList.querySelectorAll('.step').forEach((btn) => btn.addEventListener('click', () => {
        const p = byId.get(btn.dataset.id);
        ctx.map.flyTo([p.lat, p.lon], Math.max(ctx.map.getZoom(), 15), { duration: motion() ? 0.8 : 0 });
        openPopup(ctx, p);
      }));
    }

    function renderCrawlCard(ctx) {
      const box = ctx.ui.crawlBox;
      if (!box) return;
      const s = ctx.state;
      const r = fmtR(s.radiusMi);
      if (ctx.ui.crawlHead) ctx.ui.crawlHead.textContent = `≤ ${r} on foot`;
      if (s.view === 'heat') {
        box.innerHTML = `<div class="crawl-hint">${icon('flame')}<span>Heatmap view shows where spots are densest. Switch the view back to Pins to plan a crawl.</span></div>`;
      } else if (!s.crawl) {
        box.innerHTML = `<div class="crawl-hint">${icon('route')}<span>Crawl mode is off. Turn it on in the controls, then tap a 🍺 brewery.</span></div>`;
      } else if (!s.selected) {
        box.innerHTML = `<div class="crawl-hint">${icon('footprints')}<span>Tap any 🍺 brewery on the map to draw walking routes to the 3 closest taco shops within ${r}.${s.me && s.filters.near ? ' Or start from where you are with “Start crawl here”.' : ''}</span></div>`;
      } else {
        const b = originOf(ctx, s.selected);
        const total = targets.reduce((a, t) => a + t.minutes, 0);
        box.innerHTML = `
          <div class="flex items-center justify-between gap-2">
            <div class="min-w-0"><div class="pp-name" style="font-size:14px">${esc(b.name)}</div><div class="muted">${b.id === ME ? 'your location' : esc(SDX.placeLabel(b))} · start here</div></div>
            <button type="button" class="btn clear">${icon('x')}Clear</button>
          </div>
          <div class="steps">${targets.length ? targets.map((t, i) => `
            <button type="button" class="step" data-id="${t.poi.id}" style="animation-delay:${i * 70}ms">
              <span class="n mono">${i + 1}</span>
              <span class="min-w-0"><span class="t block truncate">${esc(t.poi.name)}</span><span class="m">${SDX.tags.activeLabels(t.poi).join(' · ') || 'Taco shop'}</span></span>
              <span class="w mono">${fmtMi(t.miles)} · ${t.minutes}m</span>
            </button>`).join('') : `<div class="muted">No taco shops within ${r} with the current filters.</div>`}
          </div>
          ${targets.length ? `<div class="sub" style="margin-top:8px">One-way walks at ~${SDX.geo.WALK_MPH} mph with a street-grid factor · ${total} min if you visit each and return.</div>` : ''}`;
        box.querySelector('.clear').addEventListener('click', () => ctx.setState({ selected: null }));
        box.querySelectorAll('.step').forEach((btn) => btn.addEventListener('click', () => {
          const p = byId.get(btn.dataset.id);
          ctx.map.flyTo([p.lat, p.lon], Math.max(ctx.map.getZoom(), 15), { duration: motion() ? 0.8 : 0 });
          openPopup(ctx, p);
        }));
      }
      paintIcons();
    }

    function flyToHood(ctx) {
      const s = ctx.state;
      const pts = (s.hood === 'all' ? LM : LM.filter((p) => p.hood === s.hood)).map((p) => [p.lat, p.lon]);
      if (pts.length) ctx.flyTo(L.latLngBounds(pts), { maxZoom: s.hood === 'all' ? 12.5 : 15 });
    }

    return {
      id: 'hotspots',
      name: 'Tacos & Brews',
      description: 'Craft breweries, taco shops & walkable crawls',
      icon: 'beer',
      accent: '#f2b53a',

      createState: () => ({
        filters: { crawlable: false, hazyIPA: false, open247: false, bajaFish: false, openNow: false, near: false },
        crawl: true, selected: null, hood: 'all', radiusMi: SDX.crawl.RADIUS_MI, nearMi: 3, me: null, view: 'pins',
      }),
      bounds: () => L.latLngBounds(LM.map((p) => [p.lat, p.lon])),

      onActivate(ctx) {
        const map = ctx.map;
        pins = new Map();
        memo = { filters: null, key: '', out: [] };
        introUntil = performance.now() + 1600;
        cluster = L.markerClusterGroup({
          maxClusterRadius: 52, disableClusteringAtZoom: 15, showCoverageOnHover: false,
          spiderfyOnMaxZoom: false, animate: motion(), chunkedLoading: true, iconCreateFunction: clusterIcon,
        }).addTo(ctx.layer);
        pinnedGroup = L.layerGroup().addTo(ctx.layer);
        crawlGroup = L.layerGroup().addTo(ctx.layer);
        meGroup = L.layerGroup().addTo(ctx.layer);
        const center = map.getCenter();
        const ranked = [...LM].sort((a, b) => map.distance(center, [a.lat, a.lon]) - map.distance(center, [b.lat, b.lon]));
        ranked.forEach((p, rank) => {
          const m = L.marker([p.lat, p.lon], {
            keyboard: true, riseOnHover: true, poiType: p.type,
            icon: L.divIcon({
              className: 'sdx-icon', iconSize: [0, 0], iconAnchor: [0, 0],
              html: `<div class="sdx-anchor"><div class="sdx-pin ${p.type}" style="--i:${Math.min(rank, 32)}"><span class="glyph" aria-hidden="true">${p.type === 'brewery' ? '🍺' : '🌮'}</span></div></div>`,
            }),
          });
          const pin = { p, m, shown: false, pinned: false, dim: false, selected: false, target: false, d: '' };
          m.bindTooltip(esc(p.name), { direction: 'top', offset: [0, -20], className: 'sdx-tip' });
          m.on('add', () => paintPin(pin));
          m.on('click', () => {
            if (ctx.state.view === 'heat') return;
            if (p.type === 'brewery' && ctx.state.crawl) { m.closeTooltip(); ctx.setState({ selected: p.id }); }
            else openPopup(ctx, p);
          });
          m.on('keypress', (e) => { if (e.originalEvent.key === 'Enter') m.fire('click'); });
          pins.set(p.id, pin);
        });
        onMapClick = () => { if (ctx.state.selected) ctx.setState({ selected: null }); };
        map.on('click', onMapClick);
        // Open Now depends on the clock: re-check every minute while it's on.
        openTimer = setInterval(() => {
          if (!ctx.state.filters.openNow) return;
          applyVisibility(ctx);
          if (ctx.state.selected) drawCrawl(ctx, originOf(ctx, ctx.state.selected), { fly: false });
          updateStats(ctx);
        }, 60e3);
        applyVisibility(ctx);
        syncView(ctx);
        syncMe(ctx);
        if (ctx.state.selected) drawCrawl(ctx, originOf(ctx, ctx.state.selected), { fly: false });
      },

      onDeactivate(ctx) {
        ctx.map.off('click', onMapClick);
        ctx.map.closePopup();
        ctx.map.getContainer().classList.remove('hs-heat');
        clearInterval(openTimer);
        cancelAnimationFrame(radiusRaf);
        pins = new Map();
        cluster = pinnedGroup = crawlGroup = meGroup = heat = null;
        targets = [];
      },

      onStateChange(ctx, prev) {
        const s = ctx.state;
        if (!s.crawl && s.selected) s.selected = null;
        if (s.view === 'heat' && s.selected) s.selected = null;
        if (s.selected === ME && !(s.me && s.filters.near)) s.selected = null;
        const filtersChanged = s.filters !== prev.filters || s.radiusMi !== prev.radiusMi || s.nearMi !== prev.nearMi || s.me !== prev.me;
        let vis = null;
        if (filtersChanged || s.hood !== prev.hood) vis = applyVisibility(ctx);
        if (s.selected && s.selected !== ME && vis && !vis.has(s.selected)) s.selected = null;
        if (s.selected !== prev.selected) {
          if (s.selected) drawCrawl(ctx, originOf(ctx, s.selected)); else clearCrawl();
        } else if (s.selected && filtersChanged) {
          drawCrawl(ctx, originOf(ctx, s.selected), { fly: false });
        }
        if (s.hood !== prev.hood) flyToHood(ctx);
        const nearOn = !!(s.filters.near && s.me);
        const wasNear = !!(prev.filters.near && prev.me);
        if (nearOn !== wasNear || s.me !== prev.me || s.nearMi !== prev.nearMi) {
          syncMe(ctx);
          if (nearOn) flyToMe(ctx);
        }
        if (s.view !== prev.view) syncView(ctx);
        syncControls(ctx);
        updateStats(ctx);
      },

      renderControls(el, ctx) {
        const s = ctx.state;
        el.innerHTML = `
          <div class="dock-row" style="margin-bottom:10px">
            <span class="eyebrow">Filters</span>
            <span class="muted"><b class="mono vis-count" style="color:var(--text)">${visible(ctx).length}</b> / ${LM.length} spots</span>
          </div>
          <div class="fchips">${FILTERS.map((f) => `
            <label class="fchip" data-chip="${f.key}">
              <input type="checkbox" data-key="${f.key}" ${s.filters[f.key] ? 'checked' : ''}>
              ${icon(f.icon)}<span>${f.label}<small data-hint="${f.key}">${f.hint}</small></span><span class="check" aria-hidden="true"></span>
            </label>`).join('')}
          </div>
          <div class="seg-row near-row" hidden>
            <span class="eyebrow">Within</span>
            ${segHTML('near', NEAR_OPTS.map((m) => [String(m), `${m} mi`]), 'Distance from you')}
          </div>
          <div class="rad-block">
            <div class="dock-row"><span class="eyebrow">Walk radius</span><b class="mono rad-v">--</b></div>
            <div class="range-wrap amber" style="margin-top:6px">
              <input class="sdx-range amber" type="range" min="0.5" max="3" step="0.25" aria-label="Walk radius in miles">
              <div class="range-ticks mono"><span>0.5</span><span>1</span><span>1.5</span><span>2</span><span>2.5</span><span>3 mi</span></div>
            </div>
          </div>
          <div class="seg-row">
            <span class="eyebrow">View</span>
            ${segHTML('view', [['pins', 'Pins'], ['heat', 'Heatmap']], 'Map view')}
          </div>
          <div class="dock-row" style="margin-top:12px">
            <div class="flex items-center gap-3">
              <button type="button" class="switch" role="switch" style="--accent:#f2b53a" aria-label="Taco and beer crawl mode"></button>
              <div><div class="lbl">Taco &amp; beer crawl</div><div class="sub crawl-hint-txt"></div></div>
            </div>
          </div>`;
        const ui = ctx.ui;
        ui.visCount = el.querySelector('.vis-count');
        ui.visCount._v = visible(ctx).length;
        ui.crawlSwitch = el.querySelector('.switch');
        ui.crawlHint = el.querySelector('.crawl-hint-txt');
        ui.hintCrawlable = el.querySelector('[data-hint="crawlable"]');
        ui.nearRow = el.querySelector('.near-row');
        ui.nearChip = el.querySelector('[data-chip="near"]');
        ui.segNear = el.querySelector('.seg[data-seg="near"]');
        ui.segView = el.querySelector('.seg[data-seg="view"]');
        ui.radSlider = el.querySelector('.sdx-range.amber');
        ui.radWrap = el.querySelector('.range-wrap.amber');
        ui.radV = el.querySelector('.rad-v');

        ui.crawlSwitch.addEventListener('click', () => ctx.setState({ crawl: !ctx.state.crawl }));
        el.querySelectorAll('input[data-key]').forEach((inp) => inp.addEventListener('change', () => {
          const key = inp.dataset.key;
          if (key === 'near' && inp.checked && !ctx.state.me) {
            // Only turn the filter on once we actually have a position.
            requestLocation(ctx, (ok) => { if (!ok) inp.checked = false; });
            return;
          }
          ctx.setState({ filters: { ...ctx.state.filters, [key]: inp.checked } });
        }));
        // Walk radius: coalesce slider input to one state update per frame (Crawlable is O(n^2)).
        ui.radSlider.addEventListener('input', () => {
          const v = Number(ui.radSlider.value);
          ui.radV.textContent = fmtR(v);
          ui.radWrap.style.setProperty('--p', ((v - 0.5) / 2.5).toFixed(4));
          cancelAnimationFrame(radiusRaf);
          radiusRaf = requestAnimationFrame(() => ctx.setState({ radiusMi: v }));
        });
        bindSeg(ui.segNear, (v) => ctx.setState({ nearMi: Number(v) }));
        bindSeg(ui.segView, (v) => ctx.setState({ view: v }));
        syncControls(ctx);
      },

      renderSidebar(el, ctx) {
        const rows = hoodCounts(ctx);
        el.innerHTML = `
          <section class="card near-card" hidden>
            <div class="card-h"><h3>Nearest to you</h3><button type="button" class="btn start-here">${icon('footprints')}Start crawl here</button></div>
            <div class="steps near-list" style="margin-top:0"></div>
          </section>
          <section class="card">
            <div class="card-h">
              <h3>Brewery vs taco mix</h3>
              <select class="sel" aria-label="Neighborhood">
                <option value="all">All neighborhoods</option>
                ${rows.map((r) => `<option value="${r.id}">${esc(r.name)}</option>`).join('')}
              </select>
            </div>
            <div class="donut-wrap">
              <canvas role="img" aria-label="Donut chart of breweries versus taco shops"></canvas>
              <div class="donut-center"><div><b class="mono total">0</b><span>spots shown</span></div></div>
            </div>
            <div class="split">
              <div><div class="k"><i class="sw brew"></i>Breweries</div><div class="v mono"><span class="bv">0</span><small class="bp">0%</small></div></div>
              <div><div class="k"><i class="sw taco"></i>Taco shops</div><div class="v mono"><span class="tv">0</span><small class="tp">0%</small></div></div>
            </div>
          </section>
          <section class="card">
            <div class="card-h"><h3>By area</h3><span class="muted">🍺 · 🌮 after filters</span></div>
            <div class="hood-rows">${rows.map((r) => `
              <button type="button" class="hrow" data-id="${r.id}" aria-pressed="false">
                <span class="nm">${esc(r.name)}</span>
                <span class="hbar"><i class="b" style="width:0"></i><i class="t" style="width:0"></i></span>
                <span class="ct mono">0·0</span>
              </button>`).join('')}
            </div>
          </section>
          <section class="card">
            <div class="card-h"><h3>Crawl route</h3><span class="muted crawl-head">≤ 1.5 mi on foot</span></div>
            <div class="crawl-box"></div>
          </section>
          <p class="note">${icon('info')}<span>Breweries and taco shops across San Diego County from OpenStreetMap (ODbL), national chains left out. Hours, 24/7 and seafood come from OSM where mapped (Open Now dims spots with unknown hours rather than hiding them); Crawlable and Near Me use real distances; Hazy IPA is simulated. Your location stays in this browser. Check before you go.</span></p>`;

        const ui = ctx.ui;
        ui.sel = el.querySelector('.sel');
        ui.sel.value = ctx.state.hood;
        ui.sel.addEventListener('change', () => ctx.setState({ hood: ui.sel.value }));
        ui.total = el.querySelector('.total');
        ui.bVal = el.querySelector('.bv');
        ui.tVal = el.querySelector('.tv');
        ui.bPct = el.querySelector('.bp');
        ui.tPct = el.querySelector('.tp');
        ui.crawlBox = el.querySelector('.crawl-box');
        ui.crawlHead = el.querySelector('.crawl-head');
        ui.nearCard = el.querySelector('.near-card');
        ui.nearList = el.querySelector('.near-list');
        el.querySelector('.start-here').addEventListener('click', () => {
          if (ctx.state.view === 'heat') ctx.setState({ view: 'pins' });
          if (!ctx.state.crawl) ctx.setState({ crawl: true });
          ctx.setState({ selected: ME });
        });
        ui.rows = new Map([...el.querySelectorAll('.hrow')].map((row) => {
          row.addEventListener('click', () => ctx.setState({ hood: ctx.state.hood === row.dataset.id ? 'all' : row.dataset.id }));
          return [row.dataset.id, { el: row, bEl: row.querySelector('.b'), tEl: row.querySelector('.t'), ct: row.querySelector('.ct') }];
        }));

        ui.donut = ctx.chart(el.querySelector('canvas'), {
          type: 'doughnut',
          data: {
            labels: ['Breweries', 'Taco shops', 'None'],
            datasets: [{
              data: [0, 0, 1],
              backgroundColor: [BREW, TACO, 'rgba(148,163,184,.14)'],
              hoverBackgroundColor: ['#f2b53a', '#ff7a59', 'rgba(148,163,184,.14)'],
              borderColor: '#0f1727', borderWidth: 2, borderRadius: 4, hoverOffset: 6,
            }],
          },
          options: {
            responsive: true, maintainAspectRatio: false, cutout: '74%',
            animation: motion() ? { animateRotate: true, animateScale: false, duration: 900, easing: 'easeOutQuart' } : false,
            plugins: {
              legend: { display: false },
              tooltip: { ...TOOLTIP, filter: (i) => i.dataIndex < 2, callbacks: { label: (i) => ` ${i.label}: ${i.parsed}` } },
            },
          },
        });
        updateStats(ctx);
      },

      legend(ctx) {
        const s = ctx.state;
        const rows = s.view === 'heat'
          ? '<div class="lg-ramp heat"></div><div class="lg-ticks mono"><span>fewer</span><span>denser</span></div>'
          : `<div class="lg-row"><i class="sw brew"></i>Craft brewery</div>
          <div class="lg-row"><i class="sw taco"></i>Taco shop</div>
          <div class="lg-row"><i class="sw clu"></i>Cluster · ring = 🍺/🌮 split</div>
          <div class="lg-row"><i class="sw line"></i>Crawl walk (≤ ${fmtR(s.radiusMi)})</div>`;
        const extra = (s.filters.openNow ? '<div class="lg-row"><i class="sw dimmed"></i>Dimmed = hours unknown</div>' : '')
          + (s.filters.near && s.me ? `<div class="lg-row"><i class="sw you"></i>You · ${s.nearMi} mi ring</div>` : '');
        return `<div class="lg-title">${s.view === 'heat' ? 'Spot density' : 'Hotspots'}</div>${rows}${extra}`;
      },
    };
  })();

  // Registration order = chip order.
  LayerRegistry.registerModule(Microclimates);
  LayerRegistry.registerModule(Hotspots);

  const app = new App();
  app.boot();
  window.SDXApp = app; // handy for debugging in the console

  // ==================================================================
  // MODULE 3 TEMPLATE: "Surf & Ocean"  (future extensibility example)
  // ------------------------------------------------------------------
  // To add a new visualizer, register ONE object. No core changes needed:
  //
  //   LayerRegistry.registerModule({
  //     id, name, description, icon (lucide name), accent (css color),   // chip + headers
  //     createState()            -> initial state object (kept across on/off)
  //     bounds(ctx)              -> L.LatLngBounds to fly to when switched on
  //     onActivate(ctx)          -> REQUIRED. Add layers to ctx.layer (core adds/removes it)
  //     onDeactivate(ctx)        -> unhook map/bus listeners; core fades + clears ctx.layer
  //     onStateChange(ctx, prev) -> react to ctx.setState({...})
  //     onFrame(ctx, dt)         -> optional per-frame animation hook (shared rAF loop)
  //     onFocus(ctx) / onBlur(ctx) -> this layer became / stopped being the focused one
  //     renderControls(el, ctx)  -> build the floating dock UI when focused
  //     renderSidebar(el, ctx)   -> build analytics; ctx.chart(canvas, cfg) auto-destroys
  //     legend(ctx)              -> small HTML string for the legend stack
  //   })
  //
  // ctx also carries: map, L, SDX (engine), data, bus (app-wide events), ui (per-render refs),
  // util (esc, h, icon, fmtHour, heatColor, tweenNumber, TOOLTIP ...), toast(), flyTo(), motion().
  //
  // This demo is live code (not a dead comment) but only registers with ?surf=1 in the URL,
  // so the default app ships with two modules. Because it registers AFTER boot, it also shows
  // that late registration adds a chip automatically. It follows the Microclimates clock via
  // the shared bus ('clock' event) when both layers are on.
  // ==================================================================
  if (new URLSearchParams(window.location.search).has('surf')) {
    const BREAKS = [
      { id: 'oceanside', name: 'Oceanside Pier', lat: 33.1934, lon: -117.3860, base: 3.2, swing: 1.1, phase: 0.0 },
      { id: 'swamis', name: "Swami's", lat: 33.0345, lon: -117.2927, base: 3.8, swing: 1.4, phase: 1.5 },
      { id: 'blacks', name: "Black's Beach", lat: 32.8890, lon: -117.2530, base: 4.6, swing: 1.6, phase: 0.8 },
      { id: 'windansea', name: 'Windansea', lat: 32.8298, lon: -117.2810, base: 3.4, swing: 1.2, phase: 2.2 },
      { id: 'tourmaline', name: 'Tourmaline', lat: 32.8055, lon: -117.2625, base: 2.4, swing: 0.8, phase: 3.1 },
      { id: 'ob-pier', name: 'OB Pier', lat: 32.7497, lon: -117.2551, base: 3.0, swing: 1.0, phase: 1.1 },
      { id: 'ib-pier', name: 'Imperial Beach Pier', lat: 32.5793, lon: -117.1330, base: 3.3, swing: 1.2, phase: 4.0 },
    ];
    const waveFt = (b, hour) => Math.max(0.5, b.base + b.swing * Math.sin(((hour + b.phase) / 12.4) * 2 * Math.PI));
    let dots = [];
    let unsubscribe = null;

    const update = (ctx) => {
      const { hour, minFt } = ctx.state;
      for (const d of dots) {
        const ft = waveFt(d.b, hour);
        const on = ft >= minFt;
        d.c.setRadius(6 + ft * 2.6);
        d.c.setStyle({ opacity: on ? 1 : 0.25, fillOpacity: on ? 0.35 : 0.05 });
        d.c.setTooltipContent(`${esc(d.b.name)} · ${ft.toFixed(1)} ft`);
      }
      if (ctx.ui.bars) {
        ctx.ui.bars.data.datasets[0].data = BREAKS.map((b) => +waveFt(b, hour).toFixed(1));
        ctx.ui.bars.update();
      }
      if (ctx.ui.label) ctx.ui.label.textContent = `${minFt.toFixed(1)} ft+ · ${fmtHour(hour)}`;
    };

    LayerRegistry.registerModule({
      id: 'surf',
      name: 'Surf & Ocean',
      description: 'Simulated wave heights at 7 breaks (template module)',
      icon: 'waves',
      accent: '#22d3ee',
      createState: () => ({ hour: 9, minFt: 0 }),
      bounds: () => L.latLngBounds(BREAKS.map((b) => [b.lat, b.lon])),
      onActivate(ctx) {
        dots = BREAKS.map((b) => ({
          b,
          c: L.circleMarker([b.lat, b.lon], { color: '#22d3ee', weight: 2, fillColor: '#22d3ee', fillOpacity: 0.35 })
            .bindTooltip(esc(b.name), { className: 'sdx-tip', direction: 'top' })
            .addTo(ctx.layer),
        }));
        unsubscribe = ctx.bus.on('clock', ({ hour }) => { ctx.state.hour = hour; update(ctx); });
        const clock = ctx.bus.last('clock'); // sync right away if another module already set the time
        if (clock) ctx.state.hour = clock.hour;
        update(ctx);
      },
      onDeactivate() { if (unsubscribe) unsubscribe(); unsubscribe = null; dots = []; },
      onStateChange(ctx) { update(ctx); },
      renderControls(el, ctx) {
        el.innerHTML = `
          <div class="dock-row"><span class="eyebrow">Minimum wave height</span><b class="mono surf-label"></b></div>
          <div class="range-wrap" style="margin-top:10px"><input class="sdx-range plain" type="range" min="0" max="6" step="0.5" value="${ctx.state.minFt}" aria-label="Minimum wave height in feet"></div>
          <p class="sub" style="margin-top:8px">Follows the Microclimates clock when both layers are on.</p>`;
        ctx.ui.label = el.querySelector('.surf-label');
        el.querySelector('input').addEventListener('input', (e) => ctx.setState({ minFt: Number(e.target.value) }));
        update(ctx);
      },
      renderSidebar(el, ctx) {
        el.innerHTML = `<section class="card"><div class="card-h"><h3>Wave height by break</h3><span class="muted">ft · simulated</span></div>
          <div style="position:relative;height:240px"><canvas role="img" aria-label="Bar chart of simulated wave heights"></canvas></div></section>`;
        ctx.ui.bars = ctx.chart(el.querySelector('canvas'), {
          type: 'bar',
          data: { labels: BREAKS.map((b) => b.name), datasets: [{ label: 'Wave height', data: BREAKS.map((b) => waveFt(b, ctx.state.hour)), backgroundColor: '#22d3ee', borderRadius: 4, maxBarThickness: 16 }] },
          options: {
            indexAxis: 'y', responsive: true, maintainAspectRatio: false,
            scales: { x: { min: 0, max: 7, grid: { color: 'rgba(148,163,184,.08)' }, ticks: { callback: (v) => v + ' ft' } }, y: { grid: { display: false } } },
            plugins: { legend: { display: false }, tooltip: { ...TOOLTIP, callbacks: { label: (i) => ` ${i.parsed.x.toFixed(1)} ft` } } },
          },
        });
        update(ctx);
      },
      legend: () => '<div class="lg-title">Surf</div><div class="lg-row"><i class="sw surf"></i>Break (size = wave ft)</div>',
    });
  }
})();
</script>
</body>
</html>
